services:
  - type: web
    name: revenue-recovery-backend
    rootDir: backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        sync: false
      - key: NVIDIA_NIM_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
databases:
  - name: revenue-recovery-db
    plan: free
